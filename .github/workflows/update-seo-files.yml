name: Update SEO files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap and robots
        run: python3 scripts/generate-seo-files.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- sitemap.xml robots.txt; then
            echo "SEO files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "Update SEO files"
          git push
